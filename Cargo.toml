[package]
name = "ai"
version = "0.5.0"
edition = "2024"
license = "MIT"

[features]
default = ["browser", "embed"]
browser = ["dep:obscura"]
embed = ["dep:fastembed"]

[profile.release]
strip = true

[dependencies]
log = "0.4.33"
anyhow = "1.0.104"
regex = "1.13.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap_complete = "4.6"
dirs = "7.0.0"
futures = "0.3"
glob = "0.3.4"
rig = { version = "0.42.0", features = ["rmcp"] }
rmcp = { version = "2", features = [
    "client",
    "macros",
    "transport-streamable-http-client-reqwest",
] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
serde_ignored = "0.1"
time = { version = "0.3", features = ["formatting", "macros"] }
html2text = "0.17.1"
urlencoding = "2"
reqwest = { version = "0.13", features = ["gzip", "cookies", "socks"] }
rustyline = { version = "18.0.1", default-features = false, features = [
    "custom-bindings",
] }
rand = "0.10.2"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "io-std",
    "process",
    "signal",
] }
anydoc = "0.2.4"
html2md = "0.2"
ansi_color_constants = "4.0.0"
obscura = { git = "https://github.com/h4ckf0r0day/obscura", optional = true }
bashkit = { version = "0.18", features = ["realfs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
fastembed = { version = "4.9", optional = true, default-features = false, features = [
    "ort-download-binaries",
    "hf-hub-rustls-tls",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

