[package]
name = "ai"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.3", features = ["derive", "env"] }
dirs = "6.0.0"
glob = "0.3.3"
regex = "1.13.1"
rig-core = { version = "0.40.0", features = ["rmcp"] }
rmcp = { version = "1.8", features = ["client", "macros", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
htmd = "0.1"
html2text = "0.6"
reqwest = "0.13"
scraper = "0.22"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
urlencoding = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
