[package]
name = "ai"
version = "0.3.0"
edition = "2024"

[features]
default = ["browser"]
browser = ["dep:obscura"]

[profile.release]
strip = true

[dependencies]
log = "0.4.33"
anyhow = "1.0.104"
regex = "1.13.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
dirs = "6.0.0"
futures = "0.3"
glob = "0.3.4"
rig-core = { version = "0.40.0", features = ["rmcp"] }
rmcp = { version = "1.8", features = [
    "client",
    "macros",
    "transport-streamable-http-client-reqwest",
] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
html2text = "0.17.1"
urlencoding = "2"
reqwest = { version = "0.13", features = ["gzip", "cookies", "socks"] }
rustyline = { version = "18.0.1", default-features = false, features = [
    "custom-bindings",
] }
rand = "0.10.2"
dialoguer = "0.12.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "io-std",
    "process",
] }
anydoc = "0.1.7"
html2md = "0.2"
ansi_color_constants = "4.0.0"
obscura = { git = "https://github.com/h4ckf0r0day/obscura", optional = true }
bashkit = { version = "0.14", features = ["realfs"] }

[patch.crates-io]
# Released pdf-inspector 0.1.7 pins the vulnerable lopdf 0.41 (RUSTSEC-2026-0187).
# Git main uses the fixed lopdf 0.42; override so anydoc inherits it.
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector.git" }
