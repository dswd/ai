# Example configuration for `ai`.
# Copy to ~/.config/ai/config.yaml (or pass a path with `ai -c FILE` / `ai setup FILE`),
# then customize. All keys are optional; unset values fall back to defaults.
# Generate a starting point interactively with `ai setup`.

# Provider name. Built-ins: openai, anthropic, ollama, groq, deepseek, google,
# mistral, openrouter, xai, openai-compatible, anthropic-compatible. Any
# compatible models.dev provider id also works (set `flavor` and `api_base`).
provider: openai

# Request shape the provider speaks: "openai" or "anthropic". Omitted values
# are derived from the built-in provider table.
# flavor: openai

# API key. Use a plain key, or "env:VAR_NAME" to read it from an environment
# variable at runtime instead of storing it in this file.
api_key: "env:OPENAI_API_KEY"

# Base URL override. Omitted for standard providers; required for the
# openai-compatible / anthropic-compatible providers (custom endpoints).
api_base: "https://api.openai.com/v1"

# Model to use (see the provider registry in src/providers.rs for defaults).
model: "gpt-4o"

# Optional system prompt that guides agent behavior.
system_prompt: "You are a concise, helpful CLI assistant."

# Maximum tokens per response. Unset uses the provider default.
# max_tokens: 4096

# Extended thinking budget in tokens (Anthropic flavor). Unset disables thinking.
# thinking: 16000

# Context window size in tokens; used for the interactive token-count indicator.
# context_window: 128000

# Where sessions are stored (default: <data-dir>/ai/sessions).
# session_dir: "~/.local/share/ai/sessions"

# Skills. `dir` is where SKILL.md files are discovered (default: <data-dir>/ai/skills).
# `auto_create` lets `ai dream` author skills from past sessions (default false);
# `min_tuples` is how many unreviewed exchanges a session needs first (default 10).
# skills:
#   dir: "~/.local/share/ai/skills"
#   auto_create: false
#   min_tuples: 10

# Policy file with allow/deny rules. When unset, <config-dir>/ai/policy is
# loaded if it exists; persisted approval rules are appended there.
# policy: "~/.config/ai/policy"

# Persistent memory database (enabled by default; `--no-memory` disables it).
# memory: "~/.local/share/ai/memory.db"
# Local embedding model for semantic memory search (default multilingual-e5-small).
# Options: multilingual-e5-small, multilingual-e5-base, multilingual-e5-large,
#          paraphrase-multilingual-minilm-l12-v2, paraphrase-multilingual-mpnet-base-v2,
#          bge-small-en-v1.5, all-minilm-l6-v2
# embedding_model: multilingual-e5-small
# Maximum cosine distance for a memory hit (default 0.175 for E5 models, 0.45 otherwise).
# Lower is stricter; raise it if relevant memories are being missed.
# memory_max_distance: 0.175
# Memory maintenance (`ai dream`) settings.
# auto: run maintenance automatically at the end of every interactive session
#       (default false). When false, the session asks before running it if more
#       than 50 maintenance tasks are pending.
# jobs: parallel requests used by maintenance (default 4).
# dream:
#   auto: false
#   jobs: 4

# Optional proxy for web tools (HTTP, HTTPS, or SOCKS5).
# Falls back to HTTP_PROXY/HTTPS_PROXY/ALL_PROXY/NO_PROXY environment variables.
# proxy: "http://127.0.0.1:8080"
# proxy: "socks5h://127.0.0.1:1080"

# Web-search settings. `providers` is an ordered ladder: the first backend that
# returns results wins. Keyed APIs need an api_key; SearXNG needs a url; the rest
# are name-only. When unset, the default is DuckDuckGo, Google, then Bing.
# Brave has a free tier: create a key at https://brave.com/search/api/ and set
# BRAVE_API_KEY (or use api_key: env:BRAVE_API_KEY below).
# search:
#   providers:
#     - name: brave                 # api_key defaults to env BRAVE_API_KEY
#     - name: tavily
#       api_key: env:TAVILY_API_KEY
#     - name: exa
#     - name: serper
#     - name: searxng
#       url: "http://localhost:8080/search"
#     - name: duckduckgo
#     - name: google
#     - name: bing

# Container isolation for external commands. When `default_image` is set, a
# single container is started at agent startup and every `execute` command runs
# inside it via `exec`, bind-mounting only the policy-granted read/write paths.
# The container is removed on exit.
container:
  # Image used for external commands. Unset runs them on the host (trusted).
  # `ai -X` with no image uses "debian:stable-slim".
  # default_image: "alpine:latest"
  # Runtime: auto (default; prefers docker, then podman), docker, or podman.
  runtime: auto
  # Network policy: policy (default; none unless web is granted), none, or host.
  network: policy

# Extra filesystem access for external commands comes from the policy grants
# (-r/--read and -w/--write), which become bind mounts inside the container.

# External MCP tool servers, connected at startup in addition to `--tool URL`.
# Each entry is `{ url, name? }`; `name` is only used in log messages. A server
# that fails to connect is skipped with a warning (unlike `--tool`, which aborts).
# mcp:
#   servers:
#     - url: "https://example.com/mcp"
#       name: example