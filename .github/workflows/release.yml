name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: ai-linux-amd64
            native: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: ai-linux-arm64
            native: false
            cross-packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc

          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            binary: ai-windows-amd64.exe
            native: false
            cross-packages: mingw-w64
            linker: x86_64-w64-mingw32-gcc

          - target: x86_64-apple-darwin
            os: ubuntu-latest
            binary: ai-macos-intel
            native: false
            skip: true

          - target: aarch64-apple-darwin
            os: ubuntu-latest
            binary: ai-macos-silicon
            native: false
            skip: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile toolchain
        if: ${{ !matrix.native && !matrix.skip }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.cross-packages }}

      - name: Build (native)
        if: ${{ matrix.native }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ !matrix.native && !matrix.skip }}
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
              ;;
            x86_64-pc-windows-gnu)
              export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER="${{ matrix.linker }}"
              ;;
          esac
          cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        if: ${{ !matrix.skip }}
        run: |
          exe=${{ contains(matrix.binary, '.exe') && '.exe' || '' }}
          cp "target/${{ matrix.target }}/release/ai${exe}" "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.skip }}
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 90

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'ai-*'
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
