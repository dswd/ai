name: Security Audit

on:
  schedule:
    - cron: '0 8 * * 1'
  push:
    paths:
      - 'Cargo.lock'

jobs:
  audit:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
